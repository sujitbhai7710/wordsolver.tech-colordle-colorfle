name = "colordleanswer-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "colordleanswer-db"
database_id = "82c632eb-0b4e-4693-8b6c-32fb24b9ae40"

# Cron triggers:
# - 12:00 AM IST = 18:30 UTC previous day (primary publish window)
# - 9:00 AM IST = 03:30 UTC (retry window)
# - 5:01 PM IST = 11:31 UTC (late retry window)
[triggers]
crons = ["30 18 * * *", "30 3 * * *", "31 11 * * *"]

# Environment variables (set via wrangler secret or dashboard)
# GITHUB_TOKEN - for triggering rebuilds
# GITHUB_REPO - akarohitmishra/colordlebro
