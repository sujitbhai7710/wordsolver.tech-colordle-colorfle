name: Deploy Pages

run-name: Deploy Pages${{ github.event.client_payload.target_date && format(' {0}', github.event.client_payload.target_date) || '' }}

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - pages-publish-requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.ref_name || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_ANSWER_API_BASE: ${{ vars.PUBLIC_ANSWER_API_BASE }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Astro Site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]; then
            echo "Missing CLOUDFLARE_PAGES_PROJECT_NAME secret."
            exit 1
          fi

          npx wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Deploy from ${GITHUB_EVENT_NAME}"
